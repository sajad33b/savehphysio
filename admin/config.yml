backend:
  name: github
  repo: sajad33b/savehphysio
  branch: main
  base_url: https://decap-cms-oauth.netlify.app
  auth_endpoint: /auth

media_folder: media
public_folder: /media

locale: fa

collections:
  - name: home
    label: صفحه اصلی
    file: content/home.json
    format: json
    fields:
      - { label: عنوان صفحه, name: title, widget: string, required: false }

  - name: contact
    label: تماس
    file: content/contact.json
    format: json
    fields:
      - { label: عنوان, name: title, widget: string, required: false }
