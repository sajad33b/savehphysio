<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>پنل مدیریت | کلینیک ابن‌سینا ساوه</title>
  <link rel="icon" type="image/png" href="/favicon-32.png" />
  <style>
    body {
      margin: 0;
      font-family: Tahoma, sans-serif;
      background: #f0f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #333;
    }
    .loading {
      text-align: center;
      padding: 2rem;
    }
    .loading h1 {
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
    }
    .loading p {
      color: #666;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <h1>در حال بارگذاری پنل مدیریت...</h1>
    <p>لطفاً چند لحظه صبر کنید</p>
  </div>

  <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
  <script>
    // بعد از لود شدن CMS، پیام لودینگ را مخفی کن
    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        var el = document.getElementById('loading');
        if (el) el.style.display = 'none';
      }, 1500);
    });
  </script>
</body>
</html>
