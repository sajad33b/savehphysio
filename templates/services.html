<script>
(function(){
  var btn = document.querySelector('.nav-toggle');
  var header = document.querySelector('header');
  if(!btn || !header) return;
  btn.addEventListener('click', function(){
    var open = header.classList.toggle('nav-open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  header.querySelectorAll('.nav-links a').forEach(function(a){
    a.addEventListener('click', function(){
      header.classList.remove('nav-open');
      btn.setAttribute('aria-expanded', 'false');
    });
  });
})();
</script>
<script>
(function(){
  var dots = Array.prototype.slice.call(document.querySelectorAll('.svc-spy-dot'));
  var sections = Array.prototype.slice.call(document.querySelectorAll('[data-spy]'));
  var line = document.querySelector('.svc-spy-line');
  if(!dots.length || !sections.length) return;
  function setActive(id){
    dots.forEach(function(d){
      d.classList.toggle('is-active', d.getAttribute('data-spy-target') === id);
    });
    var active = document.querySelector('.svc-spy-dot.is-active');
    if(line && active){
      var nav = document.querySelector('.svc-spy');
      var trackTop = 12;
      var y = active.offsetTop + active.offsetHeight/2 - trackTop;
      line.style.height = Math.max(0, y) + 'px';
    }
  }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){
        setActive(en.target.getAttribute('data-spy'));
      }
    });
  }, { rootMargin: '-30% 0px -50% 0px', threshold: 0.01 });
  sections.forEach(function(s){ io.observe(s); });
  if(sections[0]) setActive(sections[0].getAttribute('data-spy'));
})();
</script>
